# air config: rebuilds and restarts the server when a .go file changes (run from server/, see `make dev`).
# html/js/css/glb are NOT watched here — the server itself pushes a reload to the browser (devreload.go).
root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/server ."
  entrypoint = ["./tmp/server"]
  include_ext = ["go"]
  exclude_dir = ["tmp"]
  delay = 200
  stop_on_error = true

[misc]
  clean_on_exit = true
