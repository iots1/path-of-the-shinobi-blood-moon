<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sword Dojo: Ink Ninja</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Thai:wght@400;600&family=Yuji+Syuku&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #c9c3b8; --bar-ink: #1e1c1a; --bar-ink-soft: #57524c; --btn-line: #8a8378;
    --btn-on-bg: #1e1c1a; --btn-on-ink: #ece7dc; --on-paper: #1a1918; --seal: #9e2a1f; --focus: #9e2a1f;
    color-scheme: light; box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #151413; --bar-ink: #e6e1d7; --bar-ink-soft: #a29b90; --btn-line: #57524b;
      --btn-on-bg: #e6e1d7; --btn-on-ink: #151413; --focus: #d4574a; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #151413; --bar-ink: #e6e1d7; --bar-ink-soft: #a29b90; --btn-line: #57524b;
    --btn-on-bg: #e6e1d7; --btn-on-ink: #151413; --focus: #d4574a; color-scheme: dark;
  }
  *, *::before, *::after { box-sizing: inherit; }
  html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0; height: 100%; background: var(--bg); color: var(--bar-ink);
    font-family: "Noto Serif Thai", "Sarabun", "Leelawadee UI", Tahoma, serif;
    display: flex; flex-direction: column; overflow: hidden;
  }
  .stage-wrap { flex: 1; min-height: 0; display: grid; place-items: center; padding: 12px; }
  #stage {
    position: relative; aspect-ratio: 16 / 9; background: #e8e3d9;
    width: min(100%, calc((100dvh - 120px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)) * 16 / 9));
    box-shadow: 0 1px 0 rgba(0,0,0,.08), 0 18px 40px -24px rgba(0,0,0,.45);
    touch-action: manipulation; user-select: none; -webkit-user-select: none;
  }
  #stage canvas { display: block; width: 100%; height: 100%; cursor: crosshair; }
  .kanji {
    position: absolute; right: 7%; top: 16%; pointer-events: none;
    font-family: "Yuji Syuku", "Hiragino Mincho ProN", "Yu Mincho", serif;
    font-size: clamp(48px, 11vw, 150px); line-height: 1; color: var(--on-paper);
    opacity: 0; transform: translateY(6px) scale(.96); transition: opacity .5s ease, transform .5s ease;
  }
  .kanji.show { opacity: .9; transform: none; transition: opacity .06s, transform .12s cubic-bezier(.2,1.6,.4,1); }
  .kanji.final { color: var(--seal); }
  .bar {
    display: flex; flex-wrap: wrap; gap: 10px 24px; align-items: center; justify-content: space-between;
    padding: 4px 20px 14px; max-width: 1400px; width: 100%; margin: 0 auto;
  }
  .hint { margin: 0; font-size: 15px; line-height: 1.6; color: var(--bar-ink-soft); max-width: 62ch; }
  .hint b { color: var(--bar-ink); font-weight: 600; }
  kbd { font: inherit; font-size: 13px; padding: 0 6px; border: 1px solid var(--btn-line); border-radius: 3px; color: var(--bar-ink); }
  .toggles { display: flex; gap: 8px; flex-wrap: wrap; }
  .toggles button {
    font: inherit; font-size: 14px; color: var(--bar-ink); background: transparent;
    border: 1px solid var(--btn-line); border-radius: 999px; padding: 6px 14px; cursor: pointer;
  }
  .toggles button[aria-pressed="true"] { background: var(--btn-on-bg); color: var(--btn-on-ink); border-color: var(--btn-on-bg); }
  .toggles button:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .toggles button span { opacity: .6; margin-left: 4px; }
  @media (max-width: 640px) {
    .hint { font-size: 13px; } .toggles button { font-size: 13px; padding: 5px 11px; } .toggles button span { display: none; }
  }
</style>
</head>
<body>
  <div class="stage-wrap">
    <div id="stage" aria-label="Sword dojo, tap or click to slash">
      <div class="kanji" id="kanji" aria-hidden="true"></div>
    </div>
  </div>
  <div class="bar">
    <p class="hint"><b>Click, tap, or press <kbd>J</kbd> / <kbd>Space</kbd> to slash</b> Press repeatedly for a 3-beat combo: diagonal downward slash, upward slash, low sweep</p>
    <div class="toggles">
      <button id="btnRef" aria-pressed="false">Original art<span>R</span></button>
      <button id="btnBones" aria-pressed="false">Mesh and bones<span>B</span></button>
      <button id="btnSlow" aria-pressed="false">Slow-mo<span>S</span></button>
    </div>
  </div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pixi.js/7.4.2/pixi.min.js"></script>

/* =====================================================================
   Ink Ninja v2 — PixiJS
   Same approach as Spine / Live2D:
     • use the original painted image as a texture, deformed via mesh (linear blend skinning)
       each vertex has weights bound to a bone: root, hip, chest, head, cloakL, cloakR
     • the cloak/skirt hem has "looseness" per vertex → a trailing spring = fabric flutter
     • the sword arm uses 2-bone IK + the sleeve is a rope that curves at the elbow
     • movement isn't a direct tween: poses (keyframes) are just "targets"
       that second-order dynamics (a spring with f, ζ, r) chase after
       each joint has different values → shoulder leads, hand follows, sword trails behind
   All coordinates = pixels of the original image (690×640)
   ===================================================================== */

  mul:(m,n)=>[m[0]*n[0]+m[2]*n[1], m[1]*n[0]+m[3]*n[1], m[0]*n[2]+m[2]*n[3], m[1]*n[2]+m[3]*n[3], m[0]*n[4]+m[2]*n[5]+m[4], m[1]*n[4]+m[3]*n[5]+m[5]],
  T:(x,y)=>[1,0,0,1,x,y],
  R:(deg)=>{const r=deg*D2R,c=Math.cos(r),s=Math.sin(r);return[c,s,-s,c,0,0]},
  /** rotate around point p, then translate by (dx,dy) */
  about:(p,deg,dx=0,dy=0)=>M.mul(M.T(p.x+dx,p.y+dy),M.mul(M.R(deg),M.T(-p.x,-p.y))),
  ap:(m,x,y)=>({x:m[0]*x+m[2]*y+m[4], y:m[1]*x+m[3]*y+m[5]}),
  rot:(m)=>Math.atan2(m[1],m[0])/D2R,
};

/** Second-order dynamics (f = response speed in Hz, z = damping, r = overshoot/anticipation) */
class SOD {
  constructor(f,z,r,x0){ this.set(f,z,r); this.xp=x0; this.y=x0; this.yd=0; }
  set(f,z,r){ this.k1=z/(Math.PI*f); this.k2=1/((2*Math.PI*f)**2); this.k3=r*z/(2*Math.PI*f); }
  update(T,x){
    const xd=(x-this.xp)/T; this.xp=x;
    const k2=Math.max(this.k2, T*T/2+T*this.k1/2, T*this.k1);
    this.y+=T*this.yd; this.yd+=T*(x+this.k3*xd-this.y-this.k1*this.yd)/k2; return this.y;
  }
  snap(x){ this.xp=x; this.y=x; this.yd=0; }
}

/* ---------- RIG: bone pivot points (image coordinates) ---------- */
const RIG = {
  hip:{x:375,y:300}, chest:{x:375,y:245}, neck:{x:371,y:160},
  cloakL:{x:325,y:178}, cloakR:{x:420,y:178},
  shoulder:{x:338,y:186}, upper:98, fore:92, bend:-1,
  eyes:[{x:362,y:116},{x:378,y:116}],
};
const REST_SA = Math.atan2(KAT.tip[1]-KAT.grip[1], KAT.tip[0]-KAT.grip[0])/D2R;   // ≈148.5°
const SWORD_LEN = Math.hypot(KAT.tip[0]-KAT.grip[0], KAT.tip[1]-KAT.grip[1]);

/* ---------- POSES: targets for each beat ----------
   hx,hy  = hand position (chest-local coordinates)    sa = blade angle (degrees, can exceed 360 to indicate rotation direction)
   bx,by,br = hip   cr = chest   hr = head   cl,cR = cloak   z = camera   eye = eye glow       */
const IDLE = {hx:KAT.grip[0], hy:KAT.grip[1], sa:REST_SA, bx:0,by:0,br:0, cr:0, hr:0, cl:0,cR:0, z:1, eye:0};
const P = o=>Object.assign({}, IDLE, {z:.86, eye:1}, o);
const COMBO = [
  { name:'diagonal downward slash', kanji:'一', impact:285, chain:370, end:950,
    keys:[ [190, P({hx:425,hy:45,  sa:338, bx:6, by:-8, br:-2, cr:-6, hr:-5, cl:14, cR:-4}), 'out'],
           [300, P({hx:236,hy:322, sa:128, bx:-12,by:14, br:3,  cr:7,  hr:6,  cl:-6, cR:8}),  'snap'],
           [460, P({hx:228,hy:348, sa:122, bx:-14,by:16, br:4,  cr:8,  hr:5,  cl:-8, cR:10}), 'out'] ],
    dyn:{hand:[3.4,.55,1.2], sword:[2.6,.45,.4]} },
  { name:'upward slash', kanji:'二', impact:190, chain:280, end:840,
    keys:[ [90,  P({hx:252,hy:364, sa:112, bx:-10,by:18, br:3, cr:5, hr:3, cl:-4, cR:6}), 'out'],
           [205, P({hx:418,hy:72,  sa:338, bx:12, by:-8, br:-3,cr:-8,hr:-7,cl:18, cR:-12}), 'snap'],
           [360, P({hx:428,hy:62,  sa:352, bx:14, by:-10,br:-3,cr:-9,hr:-7,cl:20, cR:-14}), 'out'] ],
    dyn:{hand:[3.8,.5,1.4], sword:[2.8,.42,.3]} },
  { name:'low sweep', kanji:'三', impact:300, chain:9999, end:1100, final:true,
    keys:[ [170, P({hx:250,hy:250, sa:200, bx:-16,by:6,  br:-4,cr:-8,hr:7, cl:8,  cR:10}), 'out'],
           [310, P({hx:452,hy:322, sa:-26, bx:18, by:22, br:5, cr:10, hr:-6,cl:18, cR:-20}), 'snap'],
           [490, P({hx:462,hy:318, sa:-40, bx:20, by:24, br:6, cr:11, hr:-7,cl:20, cR:-22}), 'out'] ],
    dyn:{hand:[3.2,.5,1.6], sword:[2.4,.4,.5]} },
];
const KEYS = Object.keys(IDLE);
const EASE = { out:t=>1-Math.pow(1-t,3), snap:t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2, io:smoother };

/* ---------- brush helpers (for the sleeve + paper) ---------- */
function brushTexture(w,h,draw){ const c=document.createElement('canvas'); c.width=w; c.height=h; draw(c.getContext('2d'),w,h); return PIXI.Texture.from(c); }
function paintSleeve(c,w,h){
  const R=mulberry32(5), half=h/2;
  // tapered shape: wide at the shoulder, narrow at the wrist, with a slight bulge at the elbow
  const top=[],bot=[];
  for(let i=0;i<=40;i++){ const u=i/40, x=u*w;
    const th=lerp(half*.95, half*.42, u) + Math.exp(-(((u-.52)/.12)**2))*half*.12;
    top.push([x, half-th+(R()-.5)*1.2]); bot.push([x, half+th*.92+(R()-.5)*1.2]); }
  c.beginPath(); top.forEach((p,i)=>i?c.lineTo(...p):c.moveTo(...p)); bot.reverse().forEach(p=>c.lineTo(...p)); c.closePath();
  c.fillStyle='#1b1a19'; c.fill();
  c.save(); c.clip(); c.lineCap='round';
  for(let i=0;i<160;i++){ c.globalAlpha=.05+R()*.18; c.strokeStyle=R()<.55?'#5d5955':'#000';
    c.lineWidth=.8+R()*3; const x=R()*w, y=R()*h, l=20+R()*80;
    c.beginPath(); c.moveTo(x-l/2,y+(R()-.5)*2); c.quadraticCurveTo(x,y+(R()-.5)*4,x+l/2,y+(R()-.5)*2); c.stroke(); }
  // grey fabric highlight on top of the arm
  c.globalAlpha=.35; c.strokeStyle='#77736c'; c.lineWidth=2.4; c.beginPath(); c.moveTo(4,half-half*.55); c.quadraticCurveTo(w*.5,half-half*.45,w*.95,half-half*.25); c.stroke();
  c.restore();
}
function paintPaper(c,PW,PH){
  const R=mulberry32(11); c.translate(PAD_X,PAD_Y);
  const g=c.createRadialGradient(W*.5,H*.42,80,W*.5,H*.5,W*.8);
  g.addColorStop(0,'#efebe2'); g.addColorStop(1,'#dcd5c8'); c.fillStyle=g; c.fillRect(-PAD_X,-PAD_Y,PW,PH);
  for(let i=0;i<5200;i++){ c.globalAlpha=.035+R()*.04; c.strokeStyle=R()<.5?'#8a8274':'#fff'; c.lineWidth=.6;
    const x=R()*PW-PAD_X,y=R()*PH-PAD_Y,a=R()*Math.PI,l=4+R()*14; c.beginPath(); c.moveTo(x,y); c.lineTo(x+Math.cos(a)*l,y+Math.sin(a)*l); c.stroke(); }
  c.filter='blur(8px)';
  const ridge=(y0,amp,alpha,seed)=>{ const r=mulberry32(seed); c.globalAlpha=alpha; c.fillStyle='#5d5850';
    c.beginPath(); c.moveTo(-PAD_X,H+PAD_Y); for(let x=-PAD_X;x<=W+PAD_X;x+=40){ c.lineTo(x, y0-Math.abs(Math.sin(x*0.0021+seed))*amp-r()*amp*.25); } c.lineTo(W+PAD_X,H+PAD_Y); c.fill(); };
  ridge(GROUND-160,150,.07,3); ridge(GROUND-80,90,.08,11);
  c.filter='none'; c.globalAlpha=1;
  const gg=c.createLinearGradient(0,GROUND-30,0,H+PAD_Y); gg.addColorStop(0,'rgba(231,226,216,0)'); gg.addColorStop(.15,'#e4ded2'); gg.addColorStop(1,'#d3ccbe');
  c.fillStyle=gg; c.fillRect(-PAD_X,GROUND-30,PW,H+PAD_Y-GROUND+30);
  for(let i=0;i<80;i++){ c.globalAlpha=.04+R()*.08; c.strokeStyle='#6f685e'; c.lineWidth=1+R()*3;
    const x=R()*PW-PAD_X, y=GROUND+10+R()*(H+PAD_Y-GROUND), l=40+R()*240; c.beginPath(); c.moveTo(x,y); c.lineTo(x+l,y+(R()-.5)*3); c.stroke(); }
}
function loadImg(src){ return new Promise((ok,err)=>{ const i=new Image(); i.onload=()=>ok(i); i.onerror=err; i.src=src; }); }

/* =====================================================================
   SCENE
   ===================================================================== */
const stageEl=document.getElementById('stage');
const app = new PIXI.Application({ width:W, height:H, backgroundColor:0xe8e3d9, antialias:true,
  resolution:Math.min(window.devicePixelRatio||1,2), autoDensity:false });
app.view.style.width='100%'; app.view.style.height='100%';
stageEl.prepend(app.view);

const S = { speed:1, phase:'idle', combo:-1, queued:false, act:null, hitstop:0, clock:0, shake:0, trailId:0, trail:[], drops:[], stains:[] };

(async function init(){
  const [bodyImg, katImg, refImg] = await Promise.all([loadImg(BODY_PNG), loadImg(KATANA_PNG), loadImg(REF_JPG)]);
  const bodyTex=PIXI.Texture.from(bodyImg), katTex=PIXI.Texture.from(katImg), refTex=PIXI.Texture.from(refImg);

  const cam = new PIXI.Container(); app.stage.addChild(cam);
  const PW=W+PAD_X*2, PH=H+PAD_Y*2;
  const paper=new PIXI.Sprite(brushTexture(PW,PH,paintPaper)); paper.position.set(-PAD_X,-PAD_Y); cam.addChild(paper);
  const dustG=new PIXI.Graphics(); cam.addChild(dustG);

  // character: internal coordinates = original image coordinates
  const char=new PIXI.Container(); char.pivot.set(FEET.x,FEET.y); char.position.set(W/2,GROUND); cam.addChild(char);
  const stainG=new PIXI.Graphics(); char.addChild(stainG);
  const layerBack=new PIXI.Container(); char.addChild(layerBack);

  // ---- body mesh ----
  const rest=new Float32Array(MESH.v), N=rest.length/2;
  const geom=new PIXI.MeshGeometry(new Float32Array(MESH.v), new Float32Array(MESH.uv), new Uint16Array(MESH.i));
  const body=new PIXI.Mesh(geom, new PIXI.MeshMaterial(bodyTex)); char.addChild(body);
  const vbuf=geom.getBuffer('aVertexPosition');
  const cloth={ x:new Float32Array(MESH.v), v:new Float32Array(N*2) };

  const layerFront=new PIXI.Container(); char.addChild(layerFront);
  // ---- arm: rope + sword ----
  const ropePts=Array.from({length:14},()=>new PIXI.Point());
  const sleeve=new PIXI.SimpleRope(brushTexture(256,40,paintSleeve), ropePts, 0);
  layerBack.addChild(sleeve);
  const katana=new PIXI.Sprite(katTex);
  katana.anchor.set((KAT.grip[0]-KAT.box[0])/katTex.width, (KAT.grip[1]-KAT.box[1])/katTex.height);
  layerFront.addChild(katana);
  const fxG=new PIXI.Graphics(); char.addChild(fxG);
  const eyeG=new PIXI.Graphics(); char.addChild(eyeG);
  const ref=new PIXI.Sprite(refTex); ref.alpha=.5; ref.blendMode=PIXI.BLEND_MODES.MULTIPLY; ref.visible=false; char.addChild(ref);
  const debugG=new PIXI.Graphics(); debugG.visible=false; char.addChild(debugG);

  // ---- dynamics (one instance per pose value) ----
  const DYN_DEFAULT = { hand:[2.4,.7,.6], sword:[2.0,.6,.2], body:[2.2,.62,.2], head:[1.8,.45,0], cloak:[1.5,.3,0], z:[1.2,1,0], eye:[3,1,0] };
  const dyn={};
  for(const k of KEYS){ const g = k==='hx'||k==='hy'?'hand': k==='sa'?'sword': k==='hr'?'head': (k==='cl'||k==='cR')?'cloak': k==='z'?'z': k==='eye'?'eye':'body';
    dyn[k]={grp:g, s:new SOD(...DYN_DEFAULT[g], IDLE[k])}; }
  function setDyn(over){ for(const k of KEYS){ const g=dyn[k].grp; dyn[k].s.set(...((over&&over[g])||DYN_DEFAULT[g])); } }

  /* ---------- 4) COMBO / timeline ---------- */
  let target={...IDLE};
  function press(){
    if(S.phase==='idle'){ startAttack(0); return; }
    const a=S.act;
    if(a && S.combo<COMBO.length-1 && a.t>=a.def.chain){ startAttack(S.combo+1); return; }
    if(a && a.t>=a.def.impact-60) S.queued=true;
  }
  function startAttack(i){
    S.combo=i; S.queued=false; S.phase='attack'; S.trailId++;
    const def=COMBO[i];
    S.act={def, t:0, from:{...target}, impacted:false};
    setDyn(def.dyn); setArmFront(true);
  }
  function timelineTarget(a){
    const keys=a.def.keys; let prevT=0, prev=a.from;
    for(const [t,pose,ease] of keys){
      if(a.t<=t){ const u=EASE[ease]((a.t-prevT)/(t-prevT)); return mix(prev,pose,u); }
      prevT=t; prev=pose;
    }
    // recover → idle (find the closest blade angle so it doesn't spin past full circles)
    const last=keys[keys.length-1][1], idle={...IDLE, sa: REST_SA+360*Math.round((last.sa-REST_SA)/360)};
    const u=EASE.io(clamp((a.t-prevT)/(a.def.end-prevT),0,1));
    return mix(last, idle, u);
  }
  function mix(a,b,u){ const o={}; for(const k of KEYS) o[k]=lerp(a[k],b[k],u); return o; }
  let armFront=false;
  function setArmFront(f){ if(f===armFront) return; armFront=f; (f?layerFront:layerBack).addChildAt(sleeve,0); }

  /* ---------- pose → bones ---------- */
  const st={}; // current values after passing through dynamics
  for(const k of KEYS) st[k]=IDLE[k];
  function bones(p, t){
    const breathe=Math.sin(t*1.7);
    const hip=M.about(RIG.hip, p.br, p.bx, p.by+breathe*1.2);
    const chest=M.mul(hip, M.about(RIG.chest, p.cr+breathe*.35));
    const head=M.mul(chest, M.about(RIG.neck, p.hr+Math.sin(t*.9)*.7, 0, -breathe*.4));
    // the left side of the cloak gets lifted by the sword arm
    const lift=clamp((RIG.shoulder.y+150-p.hy)/220,0,1);
    const wind=Math.sin(t*1.25)*1.4+Math.sin(t*2.7)*.5;
    const cL=M.mul(chest, M.about(RIG.cloakL, p.cl+wind+lift*10));
    const cR=M.mul(chest, M.about(RIG.cloakR, p.cR+wind*.8));
    return [M.I(), hip, chest, head, cL, cR];
  }
  function armFK(p, B){
    const chest=B[2];
    const sh=M.ap(chest, RIG.shoulder.x, RIG.shoulder.y);
    const tg=M.ap(chest, p.hx, p.hy);
    // 2-bone IK
    const L1=RIG.upper, L2=RIG.fore; let dx=tg.x-sh.x, dy=tg.y-sh.y, d=Math.hypot(dx,dy);
    d=clamp(d, Math.abs(L1-L2)+2, L1+L2-.5);
    const a=Math.atan2(dy,dx), b=Math.acos(clamp((L1*L1+d*d-L2*L2)/(2*L1*d),-1,1)), a1=a+RIG.bend*b;
    const el={x:sh.x+Math.cos(a1)*L1, y:sh.y+Math.sin(a1)*L1};
    const wr={x:sh.x+Math.cos(a)*d, y:sh.y+Math.sin(a)*d};
    const sa=(p.sa+M.rot(chest))*D2R;
    const dir={x:Math.cos(sa), y:Math.sin(sa)};
    return { sh, el, wr, sa, tip:{x:wr.x+dir.x*SWORD_LEN*1.04, y:wr.y+dir.y*SWORD_LEN*1.04}, base:{x:wr.x+dir.x*SWORD_LEN*.36, y:wr.y+dir.y*SWORD_LEN*.36} };
  }

  /* ---------- 5) FX ---------- */
  const kanjiEl=document.getElementById('kanji'); let kanjiTimer;
  function impact(def){
    S.hitstop = def.final?95:60;
    S.shake = reduceMotion?0:(def.final?16:9);
    const last=S.trail.filter(s=>s.id===S.trailId), n=def.final?48:28;
    for(let i=0;i<n && last.length;i++){
      const q=last[Math.floor(Math.random()*last.length)], u=.55+Math.random()*.55;
      const x=lerp(q.b.x,q.t.x,u), y=lerp(q.b.y,q.t.y,u);
      const dir=Math.atan2(q.t.y-q.b.y,q.t.x-q.b.x)+(Math.random()-.5)*1.5, sp=120+Math.random()*(def.final?540:380);
      S.drops.push({x,y,vx:Math.cos(dir)*sp,vy:Math.sin(dir)*sp-120,r:1+Math.random()*(def.final?4.5:3.2),life:1});
    }
    kanjiEl.textContent=def.kanji; kanjiEl.classList.toggle('final',!!def.final);
    kanjiEl.classList.remove('show'); void kanjiEl.offsetWidth; kanjiEl.classList.add('show');
    clearTimeout(kanjiTimer); kanjiTimer=setTimeout(()=>kanjiEl.classList.remove('show'), def.final?900:600);
  }

  const dust=Array.from({length:34},()=>({x:Math.random()*W,y:Math.random()*H,v:6+Math.random()*14,r:.8+Math.random()*1.8,ph:Math.random()*7}));
  const skinned=new Float32Array(N*2);
  let lastArm=null, B=null, prevTip=null;

  function step(T){ // T seconds (substep)
    S.clock+=T*1000;
    if(S.act){
      const a=S.act; a.t+=T*1000;
      // the "hit" beat = when the blade tip starts decelerating after its peak speed (not a fixed time)
      if(!a.impacted && (a.decel || a.t>=a.def.impact+160)){ a.impacted=true; impact(a.def); }
      if(S.queued && a.t>=a.def.chain && S.combo<COMBO.length-1){ startAttack(S.combo+1); }
      else if(a.t>=a.def.end){ S.act=null; S.phase='idle'; S.combo=-1; setDyn(null);
        const off=360*Math.round((dyn.sa.s.y-REST_SA)/360); dyn.sa.s.y-=off; dyn.sa.s.xp-=off;
        target={...IDLE};
        if(S.queued){ S.queued=false; startAttack(0); } }
      if(S.act) target=timelineTarget(S.act);
    } else target={...IDLE};
    for(const k of KEYS) st[k]=dyn[k].s.update(T, target[k]);

    const t=S.clock/1000;
    B=bones(st,t);
    const arm=armFK(st,B); lastArm=arm;
    // collect the sword trail during a slash
    // only record the trail while the blade tip is moving fast enough (the real slash, not the windup/recoil)
    const sp = prevTip ? Math.hypot(arm.tip.x-prevTip.x, arm.tip.y-prevTip.y)/T : 0; prevTip=arm.tip;
    if(S.act){ const a=S.act, k0=a.def.keys[0][0], k1=a.def.keys[1][0];
      if(a.t>k0+25 && a.t<k1+150 && sp>1250) S.trail.push({b:arm.base, t:arm.tip, time:S.clock, id:S.trailId});
      if(a.t>k0){ a.maxSp=Math.max(a.maxSp||0, sp); if(a.maxSp>1800 && sp<a.maxSp*.5 && a.t>a.def.impact-40) a.decel=true; } }
    if(!S.act && armFront && Math.hypot(arm.wr.x-KAT.grip[0], arm.wr.y-KAT.grip[1])<6) setArmFront(false);

    // skinning + fabric
    const w=MESH.w, lo=MESH.loose;
    for(let i=0;i<N;i++){
      const x=rest[i*2], y=rest[i*2+1], wi=w[i]; let sx=0, sy=0;
      for(let b=0;b<6;b++){ const k=wi[b]; if(!k) continue; const m=B[b]; sx+=k*(m[0]*x+m[2]*y+m[4]); sy+=k*(m[1]*x+m[3]*y+m[5]); }
      const l=lo[i];
      if(l>0.01){
        const kS=lerp(1400,55,l), c=2*Math.sqrt(kS)*.42;
        let vx=cloth.v[i*2], vy=cloth.v[i*2+1], px=cloth.x[i*2], py=cloth.x[i*2+1];
        vx+=((sx-px)*kS - vx*c)*T; vy+=((sy-py)*kS - vy*c + 60*l)*T;
        px+=vx*T; py+=vy*T;
        const ox=px-sx, oy=py-sy, om=Math.hypot(ox,oy), lim=4+l*28;
        if(om>lim){ px=sx+ox/om*lim; py=sy+oy/om*lim; }
        cloth.v[i*2]=vx; cloth.v[i*2+1]=vy; cloth.x[i*2]=px; cloth.x[i*2+1]=py;
        skinned[i*2]=px; skinned[i*2+1]=py;
      } else { skinned[i*2]=sx; skinned[i*2+1]=sy; cloth.x[i*2]=sx; cloth.x[i*2+1]=sy; }
    }
    // ink droplets
    for(const d of S.drops){ d.vy+=1400*T; d.vx*=.995; d.x+=d.vx*T; d.y+=d.vy*T;
      if(d.vy>0 && d.y>FEET.y-6+Math.random()*16){ d.life=0; S.stains.push({x:d.x, y:FEET.y+Math.random()*14-4, r:d.r, life:1}); } }
    S.drops=S.drops.filter(d=>d.life>0 && d.x>-400 && d.x<1200);
    for(const s of S.stains) s.life-=T*.22; S.stains=S.stains.filter(s=>s.life>0);
  }

  function render(){
    vbuf.data.set(skinned); vbuf.update();
    const arm=lastArm;
    // sleeve: a bezier curve using the elbow as the control point (soft curve, not a hard bend)
    const cx=lerp((arm.sh.x+arm.wr.x)/2, arm.el.x, 1.35), cy=lerp((arm.sh.y+arm.wr.y)/2, arm.el.y, 1.35);
    for(let i=0;i<ropePts.length;i++){ const u=i/(ropePts.length-1), v=1-u;
      ropePts[i].set(v*v*arm.sh.x+2*v*u*cx+u*u*arm.wr.x, v*v*arm.sh.y+2*v*u*cy+u*u*arm.wr.y); }
    katana.position.set(arm.wr.x, arm.wr.y); katana.rotation=arm.sa-REST_SA*D2R;

    // camera: pulls back during a combo + shakes on a hit
    const z=st.z; cam.scale.set(z); 
    const shx=(Math.random()-.5)*S.shake, shy=(Math.random()-.5)*S.shake;
    cam.position.set(W/2*(1-z)+shx, (GROUND)*(1-z)+shy);
    S.shake*=.82; if(S.shake<.3) S.shake=0;

    // eyes
    eyeG.clear(); if(st.eye>.05){ const hd=B[3];
      for(const e of RIG.eyes){ const q=M.ap(hd,e.x,e.y); eyeG.lineStyle(1.6,0xf6f3ec,clamp(st.eye,0,1)); eyeG.moveTo(q.x-3.5,q.y); eyeG.lineTo(q.x+3.5,q.y+.3); } }

    drawTrail();
    // dust + ink stains + ink droplets
    dustG.clear(); const dt=1/60*S.speed;
    for(const d of dust){ d.y+=d.v*dt; d.x+=Math.sin(S.clock/1000*.6+d.ph)*8*dt; if(d.y>H){d.y=-5;d.x=Math.random()*W;} dustG.beginFill(0x4a463f,.22).drawCircle(d.x,d.y,d.r).endFill(); }
    stainG.clear(); for(const s of S.stains){ stainG.beginFill(0x161514,.55*s.life).drawEllipse(s.x,s.y,s.r*1.7,s.r*.45).endFill(); }
    for(const d of S.drops){ fxG.beginFill(0x121110,.92).drawCircle(d.x,d.y,d.r).endFill(); }

    if(debugG.visible) drawDebug(arm);
  }

  function drawTrail(){
    fxG.clear();
    const LIFE=360, now=S.clock;
    S.trail=S.trail.filter(s=>now-s.time<LIFE);
    const groups={}; for(const s of S.trail) (groups[s.id]=groups[s.id]||[]).push(s);
    for(const grp of Object.values(groups)){
      // thin out the points so spacing stays even
      const g=[grp[0]]; for(const s of grp){ const l=g[g.length-1]; if(Math.hypot(s.t.x-l.t.x,s.t.y-l.t.y)>5) g.push(s); }
      if(g.length<3) continue;
      const n=g.length, outer=[], inner=[], wash=[];
      for(let i=0;i<n;i++){
        const q=g[i], age=clamp((now-q.time)/LIFE,0,1), u=i/(n-1);
        const taper=Math.pow(Math.sin(Math.PI*clamp(u*1.06,0,1)),.6);
        const w=Math.pow(1-age,1.25)*taper;
        outer.push(q.t.x,q.t.y);
        inner.push(lerp(q.t.x,q.b.x,w*.48), lerp(q.t.y,q.b.y,w*.48));
        wash.push(lerp(q.t.x,q.b.x,w*.85), lerp(q.t.y,q.b.y,w*.85));
      }
      const rev=a=>{const o=[]; for(let i=a.length-2;i>=0;i-=2) o.push(a[i],a[i+1]); return o;};
      const head=clamp((now-g[n-1].time)/LIFE,0,1);
      fxG.beginFill(0x3b3833,.15*(1-head)).drawPolygon([...outer,...rev(wash)]).endFill();
      fxG.beginFill(0x121110,.94*Math.pow(1-head,.7)).drawPolygon([...outer,...rev(inner)]).endFill();
      for(const f of [.2,.36,.52,.7]){
        fxG.lineStyle(1.3,0xe9e4da,.38*(1-head));
        for(let i=0;i<n;i++){ const x=lerp(outer[i*2],inner[i*2],f), y=lerp(outer[i*2+1],inner[i*2+1],f); i?fxG.lineTo(x,y):fxG.moveTo(x,y); }
      }
      fxG.lineStyle(0);
    }
  }

  function drawDebug(arm){
    const G=debugG; G.clear();
    G.lineStyle(.6,0x2b7bc0,.35);
    const I=MESH.i;
    for(let k=0;k<I.length;k+=3){ const a=I[k]*2,b=I[k+1]*2,c=I[k+2]*2;
      G.moveTo(skinned[a],skinned[a+1]); G.lineTo(skinned[b],skinned[b+1]); G.lineTo(skinned[c],skinned[c+1]); }
    G.lineStyle(3,0xc0392b,.9);
    const hip=M.ap(B[1],RIG.hip.x,RIG.hip.y), ch=M.ap(B[2],RIG.chest.x,RIG.chest.y), nk=M.ap(B[3],RIG.neck.x,RIG.neck.y);
    G.moveTo(FEET.x,FEET.y).lineTo(hip.x,hip.y).lineTo(ch.x,ch.y).lineTo(nk.x,nk.y);
    G.moveTo(ch.x,ch.y).lineTo(arm.sh.x,arm.sh.y).lineTo(arm.el.x,arm.el.y).lineTo(arm.wr.x,arm.wr.y);
    G.lineStyle(2,0x2b7bc0,.9).moveTo(arm.wr.x,arm.wr.y).lineTo(arm.tip.x,arm.tip.y);
    G.lineStyle(0);
    for(const q of [hip,ch,nk,arm.sh,arm.el,arm.wr, M.ap(B[4],RIG.cloakL.x,RIG.cloakL.y), M.ap(B[5],RIG.cloakR.x,RIG.cloakR.y)]) G.beginFill(0xc0392b).drawCircle(q.x,q.y,5).endFill();
    // hand target (before passing through dynamics)
    const tg=M.ap(B[2],target.hx,target.hy); G.lineStyle(1.5,0xc0392b,.8).drawCircle(tg.x,tg.y,9); G.lineStyle(0);
  }

  // ---- main loop: fixed substeps 4ms ----
  let acc=0;
  app.ticker.add(()=>{
    const ms=Math.min(app.ticker.deltaMS,50)*S.speed;
    if(S.hitstop>0){ S.hitstop-=ms; render(); return; }
    acc+=ms; const STEP=4;
    while(acc>=STEP){ step(STEP/1000); acc-=STEP; }
    render();
  });
  for(let i=0;i<80;i++) step(.004); render();   // settle into the starting pose

  // ---- input ----
  app.view.addEventListener('pointerdown', e=>{ e.preventDefault(); press(); });
  window.addEventListener('keydown', e=>{
    const k=e.key.toLowerCase();
    if(k==='j'||k===' '){ e.preventDefault(); if(!e.repeat) press(); }
    else if(k==='r') toggle('btnRef'); else if(k==='b') toggle('btnBones'); else if(k==='s') toggle('btnSlow');
  });
  function toggle(id){
    const b=document.getElementById(id), on=b.getAttribute('aria-pressed')!=='true'; b.setAttribute('aria-pressed',on);
    if(id==='btnRef') ref.visible=on;
    if(id==='btnBones'){ debugG.visible=on; if(!on) debugG.clear(); }
    if(id==='btnSlow') S.speed=on?.25:1;
  }
  ['btnRef','btnBones','btnSlow'].forEach(id=>document.getElementById(id).addEventListener('click',e=>{ toggle(id); e.currentTarget.blur(); }));
  window.__dojo={app,S,press,step,render};
})();
</script>
</body>
