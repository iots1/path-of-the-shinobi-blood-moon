<!doctype html><html><head><meta charset="utf-8"><title>Run v2 review</title><style>body{margin:0;background:#eee;font:14px monospace}nav{padding:8px}iframe{width:100%;height:850px;border:0}pre{white-space:pre-wrap;padding:10px;max-height:160px;overflow:auto}button{padding:8px;margin:4px}</style></head><body><nav><button id="check">Motion check</button><button data-mode="run" data-yaw="-90">Run side</button><button data-mode="run" data-yaw="20">Run front</button><button data-mode="walk" data-yaw="-90">Walk side</button><button data-mode="combo" data-yaw="20">Combo</button></nav><pre id="report">Loading…</pre><iframe src="/?review=run-v2"></iframe><script>
const f=document.querySelector('iframe'), report=document.querySelector('#report');
f.onload=()=>{const s=f.contentDocument.createElement('script');s.type='module';s.textContent=`import * as m from '/debug/motion_check.js';window.reviewMotion=m;`;f.contentDocument.body.append(s);report.textContent='Loading RunningV2…';const timer=setInterval(()=>{if(f.contentWindow.__iso?.rig.real?.loco?.version==='v2'){clearInterval(timer);report.textContent='Ready — RunningV2 loaded (8 leg tracks)';}},200);};
document.querySelector('#check').onclick=async()=>{report.textContent='Checking…';try{report.textContent=await f.contentWindow.reviewMotion.run();await fetch('/debug/save?name=run-v2-motion.json',{method:'POST',body:JSON.stringify({report:report.textContent})});}catch(e){report.textContent=e.stack;}};
for(const b of document.querySelectorAll('[data-mode]'))b.onclick=async()=>{report.textContent=await f.contentWindow.reviewMotion.sheet({mode:b.dataset.mode,yawOff:+b.dataset.yaw,cols:3,width:1,zoom:1.7}); const canvas=f.contentDocument.querySelector('#motionSheet'); canvas.toBlob(blob=>fetch('/debug/save?name=run-v2-'+b.dataset.mode+'-'+b.dataset.yaw+'.png',{method:'POST',body:blob}));};
</script></body></html>
