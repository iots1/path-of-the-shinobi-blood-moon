<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Path of the Shinobi: Blood Moon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Thai:wght@400;600&family=Yuji+Syuku&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #c9c3b8; --bar-ink: #1e1c1a; --bar-ink-soft: #57524c; --btn-line: #8a8378;
    --btn-on-bg: #1e1c1a; --btn-on-ink: #ece7dc; --on-paper: #1a1918; --seal: #9e2a1f; --focus: #9e2a1f;
    color-scheme: light; box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #151413; --bar-ink: #e6e1d7; --bar-ink-soft: #a29b90; --btn-line: #57524b;
      --btn-on-bg: #e6e1d7; --btn-on-ink: #151413; --focus: #d4574a; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #151413; --bar-ink: #e6e1d7; --bar-ink-soft: #a29b90; --btn-line: #57524b;
    --btn-on-bg: #e6e1d7; --btn-on-ink: #151413; --focus: #d4574a; color-scheme: dark;
  }
  *, *::before, *::after { box-sizing: inherit; }
  html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0; height: 100%; background: var(--bg); color: var(--bar-ink);
    font-family: "Noto Serif Thai", "Sarabun", "Leelawadee UI", Tahoma, serif;
    display: flex; flex-direction: column; overflow: hidden;
  }
  .stage-wrap { flex: 1; min-height: 0; padding: 12px 12px 6px; display: flex; }
  #stage {
    position: relative; flex: 1; min-height: 0; background: #e9e4da; overflow: hidden;
    box-shadow: 0 1px 0 rgba(0,0,0,.08), 0 18px 40px -24px rgba(0,0,0,.45);
    touch-action: none; user-select: none; -webkit-user-select: none;
  }
  #stage canvas { display: block; width: 100%; height: 100%; cursor: crosshair; }
  #paper { position: absolute; inset: 0; pointer-events: none; mix-blend-mode: multiply; background-size: 512px 512px; }
  .kanji {
    position: absolute; right: 6%; top: 10%; pointer-events: none;
    font-family: "Yuji Syuku", "Hiragino Mincho ProN", "Yu Mincho", serif;
    font-size: clamp(48px, 10vw, 140px); line-height: 1; color: var(--on-paper);
    opacity: 0; transform: translateY(6px) scale(.96); transition: opacity .5s ease, transform .5s ease;
  }
  .kanji.show { opacity: .9; transform: none; transition: opacity .06s, transform .12s cubic-bezier(.2,1.6,.4,1); }
  .kanji.final { color: var(--seal); }
  .bar {
    display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: center; justify-content: space-between;
    padding: 4px 16px 12px; width: 100%;
  }
  .hint { margin: 0; font-size: 14px; line-height: 1.7; color: var(--bar-ink-soft); max-width: 70ch; }
  .hint span { white-space: nowrap; margin-right: 14px; }
  kbd { font: inherit; font-size: 12px; padding: 0 5px; border: 1px solid var(--btn-line); border-radius: 3px; color: var(--bar-ink); }
  .controls { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .controls button {
    font: inherit; font-size: 14px; color: var(--bar-ink); background: transparent; min-height: 36px;
    border: 1px solid var(--btn-line); border-radius: 999px; padding: 5px 13px; cursor: pointer;
  }
  .controls button.primary { background: var(--btn-on-bg); color: var(--btn-on-ink); border-color: var(--btn-on-bg); padding: 5px 22px; font-weight: 600; }
  .controls button[aria-pressed="true"] { background: var(--btn-on-bg); color: var(--btn-on-ink); border-color: var(--btn-on-bg); }
  .controls button:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .controls .sep { width: 1px; height: 22px; background: var(--btn-line); margin: 0 4px; }
  @media (max-width: 700px) { .hint { display: none; } .controls { width: 100%; justify-content: center; } }
</style>
</head>
<body>
  <div class="stage-wrap">
    <div id="stage" aria-label="Isometric sword dojo">
      <div id="paper"></div>
      <div class="kanji" id="kanji" aria-hidden="true"></div>
    </div>
  </div>
  <div class="bar">
    <p class="hint">
      <span><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> or click ground to run, hold <kbd>Shift</kbd> to walk</span>
      <span><kbd>J</kbd> / <kbd>Space</kbd> slash (press repeatedly for a 3-beat combo)</span>
      <span><kbd>Q</kbd><kbd>E</kbd> rotate camera</span>
      <span><kbd>R</kbd><kbd>F</kbd> high/low angle</span>
      <span>Scroll wheel to zoom, click-drag (or right-click drag) to free rotate</span>
    </p>
    <div class="controls">
      <button id="bRotL" title="Rotate camera left (Q)">⟲ Rotate</button>
      <button id="bRotR" title="Rotate camera right (E)">Rotate ⟳</button>
      <button id="bUp" title="High angle (R)">High angle</button>
      <button id="bDown" title="Low angle (F)">Low angle</button>
      <span class="sep"></span>
      <button id="bBones" aria-pressed="false" title="Show skeleton (B)">Skeleton</button>
      <button id="bSlow" aria-pressed="false" title="Slow-mo (T)">Slow-mo</button>
      <button id="bAtk" class="primary" title="Slash (J)">Slash</button>
    </div>
  </div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

// r128 (this game's original target) never applied sRGB/gamma color management at
// all — colors in, colors out. Three.js 0.160 defaults to physically-based color
// management, which would shift every hex/canvas color in this file. Disabling it
// keeps the existing palette and lighting looking exactly like it did under r128.
THREE.ColorManagement.enabled = false;

/* =====================================================================
   Isometric sword dojo — Three.js
   1) ART       ink-style materials (3-tone toon + inverted-hull outline + paper multiply)
   2) MAP       isometric floating-island map (InstancedMesh)
   3) RIG       real skeleton: root → hips → spine → chest → neck/head, two legs
                arms use 2-bone IK, cloak is 7 spring-bone panels
   4) ANIM      keyframes as targets + second-order dynamics per parameter
   5) COMBAT    3D sword trail, cuttable bamboo, swaying straw dummy, ink splatter
   6) CAMERA    orthographic isometric, 90° rotation / tilt / zoom / free drag
   Units = meters, character faces +Z, character's right hand = -X
   ===================================================================== */
const D2R=Math.PI/180, lerp=(a,b,t)=>a+(b-a)*t, clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const smooth=t=>t*t*(3-2*t), smoother=t=>t*t*t*(t*(t*6-15)+10);
const reduceMotion=matchMedia('(prefers-reduced-motion: reduce)').matches;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const rnd=mulberry32(21);
const V=(x=0,y=0,z=0)=>new THREE.Vector3(x,y,z);

class SOD { // second-order dynamics: f (Hz), z (damping), r (response)
  constructor(f,z,r,x0){ this.set(f,z,r); this.xp=x0; this.y=x0; this.yd=0; }
  set(f,z,r){ this.k1=z/(Math.PI*f); this.k2=1/((2*Math.PI*f)**2); this.k3=r*z/(2*Math.PI*f); }
  update(T,x){ const xd=(x-this.xp)/T; this.xp=x; const k2=Math.max(this.k2,T*T/2+T*this.k1/2,T*this.k1);
    this.y+=T*this.yd; this.yd+=T*(x+this.k3*xd-this.y-this.k1*this.yd)/k2; return this.y; }
  shift(d){ this.y+=d; this.xp+=d; }
}

/* ---------- renderer ---------- */
const stageEl=document.getElementById('stage');
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.setClearColor(0xe9e4da);
renderer.outputColorSpace=THREE.LinearSRGBColorSpace; // no output gamma curve, matches r128's default (no encoding)
renderer.useLegacyLights=true; // keep r128's light-intensity scale (pre physically-correct-lighting default)
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
stageEl.prepend(renderer.domElement);
const scene=new THREE.Scene();
const camera=new THREE.OrthographicCamera(-1,1,1,-1,0.1,200);

/* ---------- 1) ART ---------- */
const PAL={ ink:0x1c1b1a, robe:0x222120, cloak:0x7a7671, cloakD:0x5f5b57, pants:0x948f88, white:0xefebe3,
  stone:0xd2cbbf, earth:0xb9b1a4, cliff:0xa39b8e, pond:0x6f7473, bamboo:0x6c6a63, straw:0xbfb39a, wood:0x5a544c, seal:0x9e2a1f };
const grad=new THREE.DataTexture(new Uint8Array([70,70,70,255, 160,160,160,255, 255,255,255,255]),3,1,THREE.RGBAFormat);
grad.minFilter=grad.magFilter=THREE.NearestFilter; grad.generateMipmaps=false; grad.needsUpdate=true;
const matCache={};
function toon(color,map){ const k=color+'_'+(map?map.uuid:''); return matCache[k]||(matCache[k]=new THREE.MeshToonMaterial({color,gradientMap:grad,map:map||null})); }
const olCache={};
function outlineMat(t){
  if(olCache[t]) return olCache[t];
  const m=new THREE.MeshBasicMaterial({color:0x151413, side:THREE.BackSide});
  m.onBeforeCompile=s=>{ s.vertexShader=s.vertexShader.replace('#include <begin_vertex>', `vec3 transformed = position + normal * ${t.toFixed(4)};`); };
  m.customProgramCacheKey=()=>'ol'+t;
  return olCache[t]=m;
}
/** mesh + ink outline */
let OL_SCALE=1;
function inked(geo,color,t=0.012,opt={}){
  t=+(t*OL_SCALE).toFixed(4); const g=new THREE.Group();
  const m=new THREE.Mesh(geo, opt.mat||toon(color,opt.map)); m.castShadow=opt.shadow!==false; m.receiveShadow=true;
  g.add(m); if(t>0){ const o=new THREE.Mesh(geo,outlineMat(t)); g.add(o); }
  g.userData.mesh=m; return g;
}
function canvasTex(w,h,draw,repeat){ const c=document.createElement('canvas'); c.width=w; c.height=h; draw(c.getContext('2d'),w,h);
  const t=new THREE.CanvasTexture(c); if(repeat){t.wrapS=t.wrapT=THREE.RepeatWrapping;} return t; }
function strokes(c,w,h,n,colors,R=rnd,len=60,width=4){
  c.lineCap='round';
  for(let i=0;i<n;i++){ c.globalAlpha=.05+R()*.16; c.strokeStyle=colors[Math.floor(R()*colors.length)]; c.lineWidth=.8+R()*width;
    const x=R()*w,y=R()*h,a=(R()-.5)*.5,l=len*(.4+R()); c.beginPath(); c.moveTo(x-Math.cos(a)*l/2,y-Math.sin(a)*l/2);
    c.quadraticCurveTo(x+(R()-.5)*8,y+(R()-.5)*8,x+Math.cos(a)*l/2,y+Math.sin(a)*l/2); c.stroke(); }
  c.globalAlpha=1;
}
const tileTex=canvasTex(256,256,(c,w,h)=>{ c.fillStyle='#fff'; c.fillRect(0,0,w,h); strokes(c,w,h,120,['#8d867a','#6e685e','#fff'],mulberry32(4),90,5);
  c.globalAlpha=.25; c.strokeStyle='#5d574e'; c.lineWidth=2; c.strokeRect(3,3,w-6,h-6); c.globalAlpha=1; });
const clothTex=canvasTex(128,256,(c,w,h)=>{ c.fillStyle='#fff'; c.fillRect(0,0,w,h);
  c.save(); c.translate(w/2,h/2); c.rotate(Math.PI/2); c.translate(-h/2,-w/2); strokes(c,h,w,90,['#6a655f','#fff','#4b4743'],mulberry32(9),120,6); c.restore(); });
// paper overlay for the whole screen (multiply)
(function(){ const c=document.createElement('canvas'); c.width=c.height=512; const x=c.getContext('2d'), R=mulberry32(3);
  x.fillStyle='#fff'; x.fillRect(0,0,512,512);
  for(let i=0;i<5000;i++){ x.globalAlpha=.03+R()*.05; x.strokeStyle=R()<.6?'#9a9182':'#c9c0b0'; x.lineWidth=.7;
    const px=R()*512,py=R()*512,a=R()*Math.PI,l=3+R()*12; x.beginPath(); x.moveTo(px,py); x.lineTo(px+Math.cos(a)*l,py+Math.sin(a)*l); x.stroke(); }
  for(let i=0;i<900;i++){ x.globalAlpha=.05+R()*.08; x.fillStyle='#8f8676'; x.fillRect(R()*512,R()*512,1,1); }
  const p=document.getElementById('paper'); p.style.backgroundImage=`url(${c.toDataURL()})`;
  p.style.boxShadow='inset 0 0 160px rgba(120,108,90,.28)';
})();

/* ---------- lights ---------- */
scene.add(new THREE.HemisphereLight(0xffffff, 0x8f897f, .55));
const sun=new THREE.DirectionalLight(0xffffff,.8); sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048); const sc=sun.shadow.camera; sc.left=-11; sc.right=11; sc.top=11; sc.bottom=-11; sc.near=1; sc.far=60;
sun.shadow.bias=-0.0008; scene.add(sun, sun.target);

/* ---------- 2) MAP ---------- */
const MAP_N=20, tiles=new Map(), colliders=[], targets=[];
const key=(i,j)=>i+','+j;
const tileAt=(x,z)=>tiles.get(key(Math.floor(x+MAP_N/2), Math.floor(z+MAP_N/2)));
(function buildMap(){
  const R=mulberry32(77);
  for(let i=0;i<MAP_N;i++) for(let j=0;j<MAP_N;j++){
    const x=i-MAP_N/2+.5, z=j-MAP_N/2+.5;
    const r=Math.hypot(x*1.0,z*1.08)+Math.sin(Math.atan2(z,x)*3+1)*.6+R()*.5;
    if(r>8.7) continue;
    let type='earth';
    if(Math.abs(x)<.9 && z<-1.5) type='stone';                       // stone path
    if(Math.hypot(x,z)<2.6) type='stone';                            // central courtyard
    if(Math.hypot(x-4.6,z-3.4)<1.7) type='pond';                     // pond
    tiles.set(key(i,j),{i,j,x,z,type});
  }
  const box=new THREE.BoxGeometry(1,1.2,1); box.translate(0,-.6,0);
  const list=[...tiles.values()].filter(t=>t.type!=='pond');
  const mesh=new THREE.InstancedMesh(box, toon(0xffffff,tileTex), list.length);
  const ol=new THREE.InstancedMesh(box, outlineMat(0.012), list.length);
  const m=new THREE.Matrix4(), col=new THREE.Color();
  list.forEach((t,k)=>{ m.makeTranslation(t.x,0,t.z); mesh.setMatrixAt(k,m); ol.setMatrixAt(k,m);
    col.setHex(t.type==='stone'?PAL.stone:PAL.earth); col.offsetHSL(0,0,(R()-.5)*.05); mesh.setColorAt(k,col); });
  mesh.receiveShadow=true; mesh.instanceColor.needsUpdate=true; scene.add(mesh, ol);
  const water=[...tiles.values()].filter(t=>t.type==='pond');
  const wbox=new THREE.BoxGeometry(1,1.1,1); wbox.translate(0,-.68,0);
  const wm=new THREE.InstancedMesh(wbox, toon(PAL.pond), water.length);
  water.forEach((t,k)=>{ m.makeTranslation(t.x,0,t.z); wm.setMatrixAt(k,m); }); wm.receiveShadow=true; scene.add(wm);
  // ink ripple rings on the water
  for(let k=0;k<3;k++){ const ring=new THREE.Mesh(new THREE.RingGeometry(.3+k*.35,.33+k*.35,40), new THREE.MeshBasicMaterial({color:0xe9e4da,transparent:true,opacity:.5}));
    ring.rotation.x=-Math.PI/2; ring.position.set(4.6+k*.2,-.07,3.4-k*.1); scene.add(ring); }
})();
const walkable=(x,z)=>{ const t=tileAt(x,z); return t && t.type!=='pond'; };

/* ---------- decor & targets ---------- */
function addCollider(x,z,r){ colliders.push({x,z,r}); }
function rock(x,z,s){ const g=inked(new THREE.DodecahedronGeometry(s,0),0x8b857b,.014); g.position.set(x,s*.45,z);
  g.rotation.set(rnd()*3,rnd()*3,rnd()*3); g.scale.y=.7; scene.add(g); addCollider(x,z,s*.9); }
function lantern(x,z){ const g=new THREE.Group();
  const parts=[[new THREE.CylinderGeometry(.18,.24,.12,6),.06],[new THREE.CylinderGeometry(.07,.09,.55,6),.4],[new THREE.BoxGeometry(.34,.08,.34),.7],
    [new THREE.BoxGeometry(.26,.24,.26),.86],[new THREE.ConeGeometry(.33,.22,4),1.1],[new THREE.SphereGeometry(.05,6,4),1.24]];
  parts.forEach(([geo,y],k)=>{ const p=inked(geo,0x9a948a,.012); p.position.y=y; if(k===4) p.rotation.y=Math.PI/4; g.add(p); });
  const glow=new THREE.Mesh(new THREE.BoxGeometry(.2,.12,.27), new THREE.MeshBasicMaterial({color:0x2a2826})); glow.position.y=.86; g.add(glow);
  g.position.set(x,0,z); scene.add(g); addCollider(x,z,.3); }
function torii(x,z,ry){ const g=new THREE.Group(), red=0x8f2519;
  for(const s of [-1,1]){ const p=inked(new THREE.CylinderGeometry(.09,.11,2.4,8),red,.016); p.position.set(s*1.05,1.2,0); g.add(p); }
  const k=inked(new THREE.BoxGeometry(2.9,.14,.2),PAL.ink,.016); k.position.y=2.42; g.add(k);
  const k2=inked(new THREE.BoxGeometry(2.5,.12,.14),red,.014); k2.position.y=2.0; g.add(k2);
  const tab=inked(new THREE.BoxGeometry(.18,.38,.06),PAL.ink,.01); tab.position.y=2.2; g.add(tab);
  g.position.set(x,0,z); g.rotation.y=ry; scene.add(g);
  for(const s of [-1,1]) addCollider(x+Math.cos(ry)*s*1.05, z-Math.sin(ry)*s*1.05, .2); }
function bamboo(x,z,h){
  const g=new THREE.Group(); g.position.set(x,0,z); scene.add(g);
  const t={type:'bamboo', x,z,r:.07,h, g, alive:true, lastHit:-1, pieces:[], regrow:0};
  buildBamboo(t); targets.push(t); addCollider(x,z,.12); return t;
}
const LEAF_GEO=new THREE.ConeGeometry(.045,.42,3).scale(1,1,.18).translate(0,.21,0);
const LEAF_MAT=new THREE.MeshToonMaterial({color:0x4d4a45,gradientMap:grad,side:THREE.DoubleSide});
function bambooStalk(h,withLeaves){
  const s=new THREE.Group();
  s.add(inked(new THREE.CylinderGeometry(.05,.056,h,8).translate(0,h/2,0),PAL.bamboo,.01));
  for(let y=.35;y<h-.05;y+=.42){ const n=inked(new THREE.CylinderGeometry(.062,.062,.025,8),0x3e3c38,0,{shadow:false}); n.position.y=y; s.add(n); }
  if(withLeaves) for(let c=0;c<3;c++){ const y=h-.1-c*.32-rnd()*.1, base=rnd()*6.28;
    for(let k=0;k<4;k++){ const lf=new THREE.Mesh(LEAF_GEO, LEAF_MAT); lf.castShadow=true;
      const holder=new THREE.Group(); holder.position.y=y; holder.rotation.y=base+k*1.4+rnd()*.5; s.add(holder);
      lf.rotation.x=1.9+rnd()*.5; holder.add(lf); } }
  return s;
}
function buildBamboo(t){ while(t.g.children.length) t.g.remove(t.g.children[0]); t.stalk=bambooStalk(t.h,true); t.g.add(t.stalk); t.alive=true; }
function dummy(x,z){
  const g=new THREE.Group(); g.position.set(x,0,z); scene.add(g);
  const pivot=new THREE.Group(); g.add(pivot);
  const post=inked(new THREE.CylinderGeometry(.05,.06,1.7,8).translate(0,.85,0),PAL.wood,.012); pivot.add(post);
  const body=inked(new THREE.CylinderGeometry(.17,.19,.75,10),PAL.straw,.014); body.position.y=1.05; pivot.add(body);
  for(const y of [.8,1.05,1.32]){ const b=inked(new THREE.CylinderGeometry(.195,.195,.04,10),0x5c5446,0,{shadow:false}); b.position.y=y; pivot.add(b); }
  const arm=inked(new THREE.CylinderGeometry(.035,.035,.9,6),PAL.wood,.01); arm.rotation.z=Math.PI/2; arm.position.y=1.3; pivot.add(arm);
  const head=inked(new THREE.SphereGeometry(.13,10,8),PAL.straw,.012); head.position.y=1.6; pivot.add(head);
  const t={type:'dummy',x,z,r:.2,h:1.75,g,pivot,lastHit:-1,tx:new SOD(1.3,.12,0,0),tz:new SOD(1.3,.12,0,0),hits:0};
  targets.push(t); addCollider(x,z,.25); return t;
}
// place scene props
torii(0,-7.3,0);
lantern(-1.4,-4.6); lantern(1.4,-4.6);
for(const [x,z,s] of [[-5.5,2.5,.45],[-6.2,1.6,.3],[3,-5.2,.35],[6.4,-1.5,.5],[2.8,6.2,.4],[-3,6.4,.32],[5.6,5.4,.3]]) rock(x,z,s);
for(const [x,z] of [[-4.6,-2.8],[-5.4,-2.2],[-4.9,-1.6],[-5.9,-3.0],[-6.1,-1.2],[-4.2,-3.6],[-5.2,-3.9],[-6.6,-2.3],[-3.9,-1.9]]) bamboo(x+(rnd()-.5)*.3,z+(rnd()-.5)*.3,2.2+rnd()*1.1);
dummy(2.4,1.2); dummy(3.4,-.6); dummy(1.2,2.8);
// ink-line grass blades
(function(){ const geo=new THREE.ConeGeometry(.02,.2,3).translate(0,.1,0), mat=new THREE.MeshBasicMaterial({color:0x5a564f});
  const ok=[...tiles.values()].filter(t=>t.type==='earth'); const n=240, im=new THREE.InstancedMesh(geo,mat,n), m=new THREE.Matrix4(), q=new THREE.Quaternion(), e=new THREE.Euler();
  for(let k=0;k<n;k++){ const t=ok[Math.floor(rnd()*ok.length)]; e.set((rnd()-.5)*1.1,rnd()*6,(rnd()-.5)*1.1); q.setFromEuler(e);
    m.compose(V(t.x+(rnd()-.5),0,t.z+(rnd()-.5)),q,V(1,.6+rnd()*.9,1)); im.setMatrixAt(k,m); } scene.add(im); })();

    for(let i=0;i<N;i++) for(let k=0;k<5;k++){

/* ---------- 3b) RIG: real model (assets/ninja.glb) ----------
   The procedural rig above stays as an invisible driver: applySkeleton() poses it as before,
   then driveRealBones() copies each driver's rotation (relative to its rest pose) onto the
   matching real bone. Arms are aimed straight from the IK result. See docs/BONES.md.
   This model's hood/cloak/back-swords are sculpted into the mesh itself (not a separate driver
   piece) — only the eye glow still gets socketed onto the real head bone. */
const BONE_MAP=[ // [driver, glb bone] — parents before children
  ['hips','Hips'],['spine','Spine02'],['chest','Spine'],
  ['neck','neck'],['head','Head'],
  ['thighL','LeftUpLeg'],['kneeL','LeftLeg'],['ankleL','LeftFoot'],
  ['thighR','RightUpLeg'],['kneeR','RightLeg'],['ankleR','RightFoot'],
];
// Driver rest transforms, captured now while the root is still at the origin (= root-local space).
const DRIVER_REST={};
rig.root.updateMatrixWorld(true);
for(const [d] of BONE_MAP) DRIVER_REST[d]={
  m:rig[d].matrixWorld.clone(),
  qInv:rig[d].getWorldQuaternion(new THREE.Quaternion()).invert(),
  p:rig[d].getWorldPosition(V()),
};
function rootLocal(o){ rig.root.updateMatrixWorld(true); return rig.root.matrixWorld.clone().invert().multiply(o.matrixWorld); }

function loadNinja(){
  new GLTFLoader().load('assets/ninja.glb', gltf=>{
    const model=gltf.scene, bone={}; let skinned=null;
    model.traverse(o=>{ if(o.isBone) bone[o.name]=o; if(o.isSkinnedMesh) skinned=o; });
    rig.root.add(model);
    const posRL=n=>V().setFromMatrixPosition(rootLocal(bone[n]));
    // Game convention: the character's right hand is on -X. Flip the model if it was exported facing -Z.
    if(posRL('RightArm').x>posRL('LeftArm').x) model.rotation.y=Math.PI;

    const real={model, bone, bind:{}, arm:{}};
    const _rm=new THREE.Matrix4();
    for(const name in bone) real.bind[name]={q:bone[name].quaternion.clone(), rl:new THREE.Quaternion().setFromRotationMatrix(_rm.extractRotation(rootLocal(bone[name])))};
    const hips=bone['Hips'];
    real.hipsPos=posRL('Hips');
    real.hipsParentInv=rootLocal(hips.parent).invert();
    // Meshy's bind pose has the legs splayed, but the driver's rest legs hang straight down.
    // Each mapped bone's target is computed independently (its own corrected bind direction in
    // root-local space) — so correcting the thigh and knee to EACH point straight down keeps the
    // skeleton geometrically straight, but makes the knee's own rotation deviate far from its bind
    // value, which this model's imperfect auto-rig skin weights render as a visible crease. Using
    // the SAME correction for the thigh and shin instead rigidly re-aims the leg as one unit, leaving
    // each bone's rotation close to bind (no crease) while still mostly removing the splay.
    // The foot is left out on purpose: it keeps its bind orientation (flat on the ground) — giving it
    // the leg's correction too tips the toes down and reads as standing on tiptoe.
    real.corr={};
    for(const s of ['Left','Right']){
      const hip=posRL(`${s}UpLeg`), knee=posRL(`${s}Leg`);
      real.corr[`${s}UpLeg`]=real.corr[`${s}Leg`]=new THREE.Quaternion().setFromUnitVectors(knee.clone().sub(hip).normalize(),V(0,-1,0));
    }
    // bind-pose heights of the foot contact points (model root sits on the floor in bind pose);
    // applySkeleton() snaps the hips each frame so the lowest of these touches the ground
    real.ground=['LeftFoot','LeftToeBase','RightFoot','RightToeBase'].map(n=>[bone[n], posRL(n).y]);
    for(const [side,S0] of [['R','Right'],['L','Left']]){
      const up=bone[`${S0}Arm`], fo=bone[`${S0}ForeArm`], ha=bone[`${S0}Hand`];
      real.arm[side]={ up, fo, ha,
        l1:posRL(`${S0}Arm`).distanceTo(posRL(`${S0}ForeArm`)),
        l2:posRL(`${S0}ForeArm`).distanceTo(posRL(`${S0}Hand`)),
        upDir:fo.position.clone().normalize(), foDir:ha.position.clone().normalize(),
        foBind:fo.quaternion.clone(), q0:ha.quaternion.clone(),   // bind-local rotations: forearm (roll is rebuilt each frame) and hand-vs-forearm
        // in a T-pose the elbow naturally flexes toward the character's front (+Z)
        bendLocal:V(0,0,1).applyQuaternion(real.bind[up.name].rl.clone().invert()) };
    }
    real.grip={R:makeGrip(GRIP_CFG.R), L:makeGrip(GRIP_CFG.L)};

    // keep the glb's normal map: the cloth folds live there. The base-colour texture is nearly black
    // (mean ~28/255, 96% of pixels < 64), so through the shared 3-band toon ramp (darkest band 27%) the
    // whole body read as a flat silhouette. Fix: a lighter ramp just for the character + a gamma lift on
    // the albedo (dark tones only, the white rope barely moves) + a stronger normal map.
    const bodyGrad=new THREE.DataTexture(new Uint8Array([118,118,118,255, 190,190,190,255, 255,255,255,255]),3,1,THREE.RGBAFormat);
    bodyGrad.minFilter=bodyGrad.magFilter=THREE.NearestFilter; bodyGrad.generateMipmaps=false; bodyGrad.needsUpdate=true;
    skinned.material=new THREE.MeshToonMaterial({color:0xffffff, map:skinned.material.map, normalMap:skinned.material.normalMap, gradientMap:bodyGrad});
    skinned.material.normalScale.set(2.2,2.2);
    // the trousers/boots albedo is ~0, so gamma alone leaves them black: add a small floor (0.07) so their folds read
    skinned.material.onBeforeCompile=s=>{ s.fragmentShader=s.fragmentShader.replace('#include <map_fragment>','#include <map_fragment>\n diffuseColor.rgb=vec3(0.07)+0.93*pow(diffuseColor.rgb,vec3(0.42));'); };
    skinned.material.customProgramCacheKey=()=>'ninjaBodyLift';
    skinned.castShadow=true; skinned.receiveShadow=true; skinned.frustumCulled=false;
    const ol=new THREE.SkinnedMesh(skinned.geometry, outlineMat(.014));
    ol.bind(skinned.skeleton, skinned.bindMatrix); ol.frustumCulled=false;
    ol.position.copy(skinned.position); ol.quaternion.copy(skinned.quaternion); ol.scale.copy(skinned.scale);
    skinned.parent.add(ol);

    // This model's hood, cloak and back-swords are sculpted into the mesh — hide our procedural
    // stand-ins entirely. The eye glow still shows (the model's own eyes are hidden in shadow),
    // but a Mesh parented directly to a Bone under this particular rig silently fails to render
    // (the nested 0.01 Armature scale seems to confuse frustum culling) — so instead the eyes are
    // kept as world-space objects, like the hands/katana, and placed from Head's matrix each frame.
    // Head-bone-local (cm) centres of the eyes painted on the face plate in ninja.glb, in rig.eyes order (-x first).
    // Computed in Blender (bone frame == glTF Head frame); re-measure if the face is ever remodelled.
    // Also per-eye slant (rad, rotateZ in the head frame, outer end up): the head bone is rolled ~4° at rest, so the two differ.
    real.eyeLocal=[new THREE.Vector3(-2.77,10.97,11.35), new THREE.Vector3(3.58,11.59,10.90)];
    real.eyeRot=[-0.053,0.179];
    for(const e of rig.eyes) scene.add(e);
    rig.back.visible=false; rig.cloakRoot.visible=false; rig.hood.visible=false; rig.mask.visible=false;
    // hide the procedural body; the driver groups themselves keep running invisibly
    for(const [d] of BONE_MAP) for(const c of rig[d].children) if(c.userData.mesh) c.visible=false;
    for(const s of ['R','L']) for(const p of ['upper','fore','hand']) rig[p+s].visible=false;
    rig.real=real;
    console.log('[GLTF] ninja.glb attached', {flipped:model.rotation.y!==0, armR:[real.arm.R.l1,real.arm.R.l2], hips:real.hipsPos.toArray()});
    loadLocoClips(real);
  }, undefined, err=>console.error('[GLTF] failed to load assets/ninja.glb — keeping the procedural character', err));
}

/* Locomotion: Meshy's free walk + run clips (same rig, in place) drive the LEGS ONLY while moving;
   hips, torso, arms/sword IK and attacks stay procedural. Both clips share one normalized phase
   (left foot furthest forward at u=.25 in each), are blended walk→run by speed, and the result is
   slerped over the procedural legs by walkAmt. Phase advances at speed / blended stride length (so
   the planted foot roughly matches the ground) × CADENCE_BOOST, and walkPhase is derived from the
   same phase so the procedural arm swing / torso twist stay in step with the clip's legs. */
const RUN_SPEED=4.0;      // top movement speed, m/s
const WALK_SPEED=1.6;     // movement speed while Shift is held, m/s
const RUN_LEAN=.24;       // extra forward spine lean (rad) at full run
const CADENCE_BOOST=1.2;  // >1 = quicker steps than the stride strictly allows (slight foot slide)
const LOCO_BONES=['LeftUpLeg','LeftLeg','LeftFoot','LeftToeBase','RightUpLeg','RightLeg','RightFoot','RightToeBase'];
function calibrateClip(real, clip){
  const tracks=new Map();
  for(const tr of clip.tracks){ const [n,prop]=tr.name.split('.');
    if(prop==='quaternion' && LOCO_BONES.includes(n) && real.bone[n]) tracks.set(real.bone[n], tr.createInterpolant()); }
  // sample one cycle with the hips at bind: how fast a planted toe moves backward (= ground speed at
  // rate 1) and when the left foot is furthest forward
  for(const name in real.bind) real.bone[name].quaternion.copy(real.bind[name].q);
  const dur=clip.duration, N=60, toe=real.bone.LeftToeBase, foot=real.bone.LeftFoot, s=[];
  for(let i=0;i<N;i++){ const t=dur*i/N;
    for(const [b,it] of tracks) b.quaternion.fromArray(it.evaluate(t)).normalize();
    real.model.updateMatrixWorld(true);
    const tp=V().setFromMatrixPosition(rootLocal(toe)), fp=V().setFromMatrixPosition(rootLocal(foot));
    s.push({t, ty:tp.y, tz:tp.z, fz:fp.z}); }
  for(const name in real.bind) real.bone[name].quaternion.copy(real.bind[name].q);
  const minY=Math.min(...s.map(o=>o.ty)); let dz=0, n=0;
  for(let i=0;i<N;i++){ const a=s[i], b=s[(i+1)%N]; if(a.ty<minY+.015 && b.ty<minY+.015){ dz+=a.tz-b.tz; n++; } }
  const speed=n ? (dz/n)/(dur/N) : 2;
  return {tracks, dur, speed, stride:speed*dur, uFwd:s.reduce((m,o)=>o.fz>m.fz?o:m).t/dur};
}
function loadLocoClips(real){
  const ld=f=>new Promise((ok,no)=>new GLTFLoader().load(f, g=>ok(g.animations[0]), undefined, no));
  Promise.all([ld('assets/anim/walk.glb'), ld('assets/anim/run.glb')]).then(([w,r])=>{
    real.loco={walk:calibrateClip(real,w), run:calibrateClip(real,r), u:0, w:0, b:0};
    const L=real.loco; console.log('[GLTF] loco clips ready', {walk:[+L.walk.speed.toFixed(2),+L.walk.dur.toFixed(2)], run:[+L.run.speed.toFixed(2),+L.run.dur.toFixed(2)]});
  }).catch(err=>console.warn('[GLTF] no locomotion clips — procedural legs only', err));
}
const _qw=new THREE.Quaternion();
function locoPose(L, bone, out){ // walk/run pose for one bone at the shared phase, blended by L.b

  const off=V(Math.sin(yaw)*Math.cos(pitch),Math.sin(pitch),Math.cos(yaw)*Math.cos(pitch)).multiplyScalar(40);
  camera.position.copy(CAM.focus).add(off);
  camera.up.set(0,1,0); camera.lookAt(CAM.focus);
  if(S.shake>0){ const r=V(Math.cos(yaw),0,-Math.sin(yaw)); camera.position.addScaledVector(r,(rnd()-.5)*S.shake).y+=(rnd()-.5)*S.shake; S.shake*=.86; if(S.shake<.004) S.shake=0; }
  const w=stageEl.clientWidth, h=stageEl.clientHeight||1, asp=w/h;
  camera.top=zoom; camera.bottom=-zoom; camera.left=-zoom*asp; camera.right=zoom*asp; camera.updateProjectionMatrix();
  sun.position.copy(CAM.focus).add(V(-6,14,5)); sun.target.position.copy(CAM.focus);
}
function camBasis(){ const yaw=CAM.yaw.y*D2R; return {fwd:V(-Math.sin(yaw),0,-Math.cos(yaw)), right:V(Math.cos(yaw),0,-Math.sin(yaw))}; }

/* ---------- simulation step ---------- */
let lastArm=null;
function step(T){
  S.clock+=T*1000;
  // ---- movement ----
  let ix=0,iz=0; if(keys.w||keys.arrowup) iz+=1; if(keys.s||keys.arrowdown) iz-=1; if(keys.d||keys.arrowright) ix+=1; if(keys.a||keys.arrowleft) ix-=1;
  const {fwd,right}=camBasis(); const want=V();
  if(ix||iz){ want.addScaledVector(fwd,iz).addScaledVector(right,ix).normalize(); S.moveTo=null; }
  else if(S.moveTo){ const d=V(S.moveTo.x-S.pos.x,0,S.moveTo.z-S.pos.z); if(d.length()<.12) S.moveTo=null; else want.copy(d.normalize()); }
  const canMove=S.phase==='idle';
  const tv=want.multiplyScalar(canMove?(keys.shift?WALK_SPEED:RUN_SPEED):0);
  if(S.act && S.act.def.lunge){ const a=S.act, k0=a.def.keys[0][0], k1=kHit(a.def); if(a.t>k0-40 && a.t<k1) tv.add(V(Math.sin(S.facing),0,Math.cos(S.facing)).multiplyScalar(a.def.lunge)); }
  S.vel.lerp(tv,1-Math.exp(-T*(tv.lengthSq()?12:9)));
  const np=S.pos.clone().addScaledVector(S.vel,T);
  for(const c of colliders){ const dx=np.x-c.x, dz=np.z-c.z, d=Math.hypot(dx,dz), m=c.r+.28; if(d<m&&d>1e-4){ np.x=c.x+dx/d*m; np.z=c.z+dz/d*m; } }
  const pad=.3; const ok=(x,z)=>walkable(x,z)&&walkable(x+pad,z)&&walkable(x-pad,z)&&walkable(x,z+pad)&&walkable(x,z-pad);
  if(ok(np.x,np.z)) S.pos.copy(np); else if(ok(np.x,S.pos.z)) S.pos.x=np.x; else if(ok(S.pos.x,np.z)) S.pos.z=np.z; else S.moveTo=null;
  const sp=Math.hypot(S.vel.x,S.vel.z);
  if(canMove && sp>.3) S.facing=Math.atan2(S.vel.x,S.vel.z);
  { let d=S.facing-facingS.y; d=Math.atan2(Math.sin(d),Math.cos(d)); facingS.update(T,facingS.y+d); }
  S.walkAmt=lerp(S.walkAmt,canMove?clamp(sp/WALK_SPEED,0,1):0,1-Math.exp(-T*8)); S.walkPhase+=T*sp*3.3;

  // ---- attack timeline ----
  if(S.act){ const a=S.act; a.t+=T*1000;
    if(S.queued && a.t>=a.def.chain && S.combo<COMBO.length-1) startAttack(S.combo+1);
    else if(a.t>=a.def.end){ S.act=null; S.phase='idle'; S.combo=-1; setDyn(null);
      if(Math.abs(dyn.spin.y)>180){ const off=360*Math.round(dyn.spin.y/360); dyn.spin.shift(-off); S.facing+=off*D2R; facingS.shift(off*D2R); }
      if(S.queued){ S.queued=false; startAttack(0); } }
    S.target = S.act ? timeline(S.act) : {...IDLE};
  } else S.target={...IDLE};
  for(const k of KEYS) S.st[k]=dyn[k].update(T,S.target[k]);
  const saveF=S.facing; S.facing=facingS.y;
  const arm=applySkeleton(S.st,T); lastArm=arm;
  S.facing=saveF;
  // ---- trail ----
  const tsp=S.prevTip?arm.tip.distanceTo(S.prevTip)/T:0; S.prevTip=arm.tip.clone();
  if(S.act){ const a=S.act, k0=a.def.keys[0][0], k1=kHit(a.def);
    if(a.t>k0+15 && a.t<k1+170 && tsp>5.5){ let s=strokesList.find(x=>x.id===S.trailId)||newStroke(S.trailId); s.samples.push({b:arm.base,t:arm.tip,time:S.clock}); if(s.samples.length>TRAIL_MAX) s.samples.shift(); }
    if(a.t>k0){ a.maxSp=Math.max(a.maxSp,tsp); if(!a.impacted && ((a.maxSp>8 && tsp<a.maxSp*.45 && a.t>a.def.impactMin) || a.t>a.def.impactMin+220)){ a.impacted=true; showKanji(a.def); if(!S.shake) S.shake=reduceMotion?0:.05; } }
    hitTest(arm);
  }
  // ---- world ----
  for(const t of targets) if(t.type==='dummy'){ t.pivot.rotation.x=t.tx.update(T,0)*D2R; t.pivot.rotation.z=t.tz.update(T,0)*D2R; }
  updatePieces(T); updateParticles(T);
}

/* ---------- loop ---------- */
let acc=0, last=performance.now();
function frame(now, manualMs, noRender){
  const ms=Math.min(manualMs ?? (now-last),50)*S.speed; last=now;
  if(S.hitstop>0){ S.hitstop-=ms; }
  else { acc+=ms; while(acc>=4){ step(.004); acc-=4; } }
  updateCamera(Math.max(ms,1)/1000);
  updateStrokes();
  if(boneLines.visible && lastArm) drawBones(lastArm);
  if(!noRender) renderer.render(scene,camera);
}
let rafOn=true; function raf(t){ if(!rafOn) return; frame(t); requestAnimationFrame(raf); }
function resize(){ const w=stageEl.clientWidth, h=stageEl.clientHeight; renderer.setSize(w,h); }
new ResizeObserver(resize).observe(stageEl); resize();
for(let i=0;i<60;i++) step(.004);
requestAnimationFrame(raf);

/* ---------- input ---------- */
const ray=new THREE.Raycaster(), ground=new THREE.Plane(V(0,1,0),0);
window.addEventListener('keydown',e=>{ const k=e.key.toLowerCase(); keys.shift=e.shiftKey;
  if(['w','a','s','d','arrowup','arrowdown','arrowleft','arrowright'].includes(k)){ keys[k]=true; e.preventDefault(); }
  if(e.repeat) return;
  if(k==='j'||k===' '||k==='k'){ e.preventDefault(); press(); }
  else if(k==='q') rotateCam(-90); else if(k==='e') rotateCam(90);
  else if(k==='r') tiltCam(12); else if(k==='f') tiltCam(-12);
  else if(k==='b') toggle('bBones'); else if(k==='t') toggle('bSlow'); });
window.addEventListener('keyup',e=>{ keys[e.key.toLowerCase()]=false; keys.shift=e.shiftKey; });
window.addEventListener('blur',()=>{ for(const k in keys) keys[k]=false; });
const cv=renderer.domElement; let drag=null;
cv.addEventListener('contextmenu',e=>e.preventDefault());
cv.addEventListener('pointerdown',e=>{ cv.setPointerCapture(e.pointerId); drag={x:e.clientX,y:e.clientY,moved:false,isClick:e.button===0&&!e.shiftKey}; });
cv.addEventListener('pointermove',e=>{ if(!drag) return; const dx=e.clientX-drag.x, dy=e.clientY-drag.y;
  if(!drag.moved && Math.hypot(dx,dy)>7) drag.moved=true;
  if(drag.moved){ CAM.yawT-=dx*.35; tiltCam(dy*.18); drag.x=e.clientX; drag.y=e.clientY; } }); // any held drag free-orbits (full 360° yaw)
cv.addEventListener('pointerup',e=>{ if(drag && !drag.moved && drag.isClick){
    const r=cv.getBoundingClientRect(); ray.setFromCamera({x:(e.clientX-r.left)/r.width*2-1,y:-(e.clientY-r.top)/r.height*2+1},camera);
    const p=ray.ray.intersectPlane(ground,V()); if(p && walkable(p.x,p.z)) S.moveTo=p; }
  drag=null; });
cv.addEventListener('wheel',e=>{ e.preventDefault(); CAM.zoomT=clamp(CAM.zoomT*Math.pow(1.0015,e.deltaY),2.2,9); },{passive:false});
function toggle(id){ const b=document.getElementById(id), on=b.getAttribute('aria-pressed')!=='true'; b.setAttribute('aria-pressed',on);
  if(id==='bBones'){ boneLines.visible=joints.visible=on; } if(id==='bSlow') S.speed=on?.25:1; }
const bind=(id,fn)=>document.getElementById(id).addEventListener('click',e=>{ fn(); e.currentTarget.blur(); });
bind('bRotL',()=>rotateCam(-90)); bind('bRotR',()=>rotateCam(90)); bind('bUp',()=>tiltCam(12)); bind('bDown',()=>tiltCam(-12));
bind('bBones',()=>toggle('bBones')); bind('bSlow',()=>toggle('bSlow'));
document.getElementById('bAtk').addEventListener('pointerdown',e=>{ e.preventDefault(); press(); });
window.__iso={S,step,frame,stop:()=>{rafOn=false;},press,CAM,rotateCam,tiltCam,rig,
  GRIP_CFG, GRIP_TUNE, IDLE, COMBO, regrip:()=>{ if(rig.real) rig.real.grip={R:makeGrip(GRIP_CFG.R), L:makeGrip(GRIP_CFG.L)}; }};  // edit GRIP_CFG in the console, call regrip(), to tune the grip live
loadNinja();
</script>
