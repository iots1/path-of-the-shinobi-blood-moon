<!doctype html><html lang="th"><meta charset="utf-8"><title>Run — reference overlay</title>
<style>*{box-sizing:border-box}body{margin:0;background:#17191d;color:#eee;font:14px system-ui}header{padding:12px 18px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}h1{font-size:18px;margin:0 16px 0 0}button,select{background:#32363e;color:white;border:1px solid #69707d;border-radius:5px;padding:8px;cursor:pointer}label{display:flex;align-items:center;gap:5px}input{width:105px}#status{padding:8px 18px;line-height:1.7;background:#24272d}main{display:flex;justify-content:center}canvas{max-width:100%;max-height:calc(100vh - 190px);object-fit:contain}iframe{position:fixed;left:-1100px;top:0;width:1024px;height:768px;border:0}small{color:#aeb7c5}#measure{font-variant-numeric:tabular-nums}a{color:#8ddce9}</style>
<header><h1>วิ่ง · ภาพซ้อนอ้างอิง</h1><button id="play">หยุด / Pause</button><button id="step">+ 1 เฟรม</button><button id="before">สลับเอียงน้อย / มาก</button><button id="match">จัดแนวลำตัว + เลือกเฟรมใกล้ ref</button><button id="save">แคป PNG + ข้อมูล</button><button id="compare">แคปก่อน / หลัง</button><a href="/">กลับเกม</a></header>
<header><label>Ref โปร่งใส <input id="opacity" type="range" min="0" max="1" step=".05" value=".5"></label><label>เอียงตัว <input id="lean" type="range" min=".2" max="1.4" step=".01" value=".62"><output id="leanValue">.62</output></label><label>ความเร็ว <select id="speed"><option value=".25">¼×</option><option value=".5" selected>½×</option><option value="1">1×</option></select></label><label><input id="bones" type="checkbox" checked style="width:auto">แนวกระดูก</label><label><input id="volume" type="checkbox" checked style="width:auto">รักษาปริมาตรข้อ</label><label>น้ำหนักผิว <select id="weights"><option value="/assets/ninja-bodyfix-v1.glb">แก้ท้องยุบ</option><option value="/assets/raw/backup-before-run-body-fix-2026-10-20/ninja.glb">ต้นฉบับ</option></select></label><label>แสดง <select id="view"><option value="overlay">ภาพซ้อน</option><option value="model">แอนิเมชันอย่างเดียว</option><option value="ref">Ref อย่างเดียว</option></select></label></header>
<div id="status"><div id="measure">กำลังโหลดโมเดล…</div><small>ชมพู = จุดบนภาพ ref · ฟ้า = กระดูกเกม · ยึดสะโพกจุดเดียวกันและใช้สเกลเดียวทั้งตัว ไม่มีการหมุนหรือยืดภาพเกมเพื่อให้ดูตรง</small></div>
<main><canvas id="overlay" width="1024" height="768"></canvas></main><iframe src="/?motionOverlay=1&amp;model=/assets/ninja-bodyfix-v1.glb"></iframe>
<script>
const $=s=>document.querySelector(s), f=$('iframe'), cv=$('#overlay'),g=cv.getContext('2d'),ref=new Image();ref.src='/assets/reference/ninja-run-side.jpeg';
// Manually marked anatomy in the original 1024×765 reference, not bounding-box fitting.
const REF={hips:[554,363],neck:[711,177],head:[757,135],hand:[385,228],leadKnee:[682,466],leadAnkle:[539,607],trailKnee:[405,505],trailAnkle:[284,657]};
const desired=Math.atan2(REF.neck[0]-REF.hips[0],REF.hips[1]-REF.neck[1])*180/Math.PI;
let I,R,V,playing=true,last=0,ready=false,busy=false,transform,metrics={},phase=0,fitScale=null,rafStarted=false;
const anchor=[2.5,0,-1];
function advance(ms){const S=I.S;S.pos.set(...anchor);S.facing=0;S.moveTo=new V(anchor[0],0,anchor[2]+50);I.frame(0,ms,true);S.pos.set(...anchor);}
function world(name){return R.bone[name].getWorldPosition(new V());}
function project(p){const q=p.clone().project(I.camera);return [(q.x+1)*512,(1-q.y)*384];}
function alignment(){const h=project(world('Hips')),n=project(world('neck'));const scale=fitScale??(fitScale=Math.hypot(REF.neck[0]-REF.hips[0],REF.neck[1]-REF.hips[1])/Math.hypot(n[0]-h[0],n[1]-h[1]));transform={scale,x:REF.hips[0]-h[0]*scale,y:REF.hips[1]-h[1]*scale};return {h,n};}
function point(name){const p=project(world(name));return [p[0]*transform.scale+transform.x,p[1]*transform.scale+transform.y];}
function render(){
 if(ready)R.skinning.useOriginalWeights(!$('#weights').value.includes('bodyfix'));
 if(I.shaderErrors?.length){$('#measure').textContent='Shader error: '+I.shaderErrors.join('\n');return;}
 if(R.skinning)R.skinning.enabled=$('#volume').checked;
 const sourceCanvas=I.renderer.domElement;if(Math.abs(sourceCanvas.width/sourceCanvas.height-1024/768)>.005){$('#measure').textContent='Waiting for 1024×768 render surface (no image stretching)';return;}
 const C=I.CAM;C.yaw.y=C.yawT=-90;C.pitch.y=C.pitchT=0;C.zoom.y=C.zoomT=1.7;C.focus.set(anchor[0],.95,anchor[2]);I.frame(0,0);
 alignment();g.fillStyle='#aaa';g.fillRect(0,0,1024,768);
 const view=$('#view').value,alpha=+$('input#opacity').value;
 if(view!=='model'){g.globalAlpha=view==='ref'?1:alpha;g.drawImage(ref,0,0,1024,765);}
 if(view!=='ref'){g.globalAlpha=view==='model'?1:1-alpha;g.save();g.translate(transform.x,transform.y);g.scale(transform.scale,transform.scale);g.drawImage(I.renderer.domElement,0,0,1024,768);g.restore();}g.globalAlpha=1;
 const hips=point('Hips'),neck=point('neck'),head=point('Head'),hand=point('RightHand');
 const angle=Math.atan2(neck[0]-hips[0],hips[1]-neck[1])*180/Math.PI;
 const torso3=world('neck').sub(world('Hips')).applyQuaternion(I.rig.root.quaternion.clone().invert());const worldAngle=Math.atan2(torso3.z,torso3.y)*180/Math.PI;
 if($('#bones').checked){
  const line=(a,b,c)=>{g.strokeStyle=c;g.lineWidth=3;g.beginPath();g.moveTo(...a);g.lineTo(...b);g.stroke();};
  const dot=(p,c,label)=>{g.fillStyle=c;g.beginPath();g.arc(...p,5,0,7);g.fill();g.font='bold 15px system-ui';g.fillText(label,p[0]+8,p[1]-7);};
  line(REF.hips,REF.neck,'#ff57b8');line(hips,neck,'#20edff');line(neck,head,'#20edff');
  for(const side of ['Left','Right']){let names=[side+'UpLeg',side+'Leg',side+'Foot'];for(let i=1;i<3;i++)line(point(names[i-1]),point(names[i]),'#20edff');}
  for(const [name,label] of [['hips','ref hip'],['neck','ref neck'],['hand','ref hand']])dot(REF[name],'#ff57b8',label);
  dot(hips,'#20edff','hip');dot(neck,'#20edff','neck');dot(hand,'#20edff','hand');
 }
 const neckError=Math.hypot(neck[0]-REF.neck[0],neck[1]-REF.neck[1]),handError=Math.hypot(hand[0]-REF.hand[0],hand[1]-REF.hand[1]);
 metrics={shaderErrors:I.shaderErrors,volumeSkinning:$('#volume').checked,unsupportedScale:R.skinning?.unsupportedScale,model:$('#weights').value,lean:I.RUN_TUNE.lean,headCounter:I.RUN_TUNE.headCounter,torsoAngle:angle,worldTorsoAngle:worldAngle,renderAspect:sourceCanvas.width/sourceCanvas.height,refTorsoAngle:desired,neckErrorPx:neckError,handErrorPx:handError,phase:R.loco.u,alignment:transform,projected:{shoulder:point('RightArm'),hand:point('RightHand'),hips:point('Hips'),neck:point('neck')},bodyLengths:{hipNeck:world('Hips').distanceTo(world('neck')),hipHead:world('Hips').distanceTo(world('Head')),arm:R.arm.R.l1+R.arm.R.l2},runPose:{...I.RUN_V2},runArm:{...I.RUN_ARM},referenceLandmarks:REF};
 $('#measure').textContent=`ตัวจริง ${angle.toFixed(1)}° / ref ${desired.toFixed(1)}° จากแนวตั้ง · คลาดแนวคอ ${neckError.toFixed(1)} px · เฟส ${(R.loco.u*100).toFixed(0)}% · lean ${I.RUN_TUNE.lean.toFixed(2)} rad · ${playing?'กำลังเล่น':'หยุดเฟรม'}`;
 g.fillStyle='rgba(15,18,23,.83)';g.fillRect(12,12,610,38);g.fillStyle='#fff';g.font='18px system-ui';g.fillText(`GAME ${angle.toFixed(1)}°   REF ${desired.toFixed(1)}°   neck Δ ${neckError.toFixed(1)} px`,24,38);
}
function tick(t){if(ready&&!busy){if(playing)advance(Math.min(t-last||16,32)*+$('#speed').value);render();}last=t;requestAnimationFrame(tick);}
async function init(){
 const style=f.contentDocument.createElement('style');style.textContent='.stage-wrap{position:fixed!important;inset:0!important;width:100%!important;height:100%!important;padding:0!important}#stage{width:100%!important;height:100%!important;box-shadow:none!important}';f.contentDocument.head.append(style);
 while(!f.contentWindow.__iso?.rig.real?.loco?.version || !ref.complete){$('#measure').textContent='Loading: game '+!!f.contentWindow.__iso+' / model '+!!f.contentWindow.__iso?.rig.real+' / clip '+f.contentWindow.__iso?.rig.real?.loco?.version+' / ref '+ref.complete;await new Promise(r=>setTimeout(r,100));}
 I=f.contentWindow.__iso;R=I.rig.real;V=R.hipsPos.constructor;await R.skinning.loadOriginalWeights('/assets/raw/backup-before-run-body-fix-2026-10-20/ninja.glb');I.stop();I.loop('off');I.S.act=null;I.S.phase='idle';I.S.speed=1;
 const scene=I.rig.root.parent,keep=new Set([I.rig.root,I.rig.katana,I.rig.katana2,...I.rig.eyes]);
 for(const c of scene.children)if(!keep.has(c)&&!c.isLight)c.visible=false;
 for(let i=0;i<100;i++)advance(16);ready=true;for(const b of document.querySelectorAll('button'))b.disabled=false;$('#lean').value=I.RUN_TUNE.lean;$('#leanValue').value=I.RUN_TUNE.lean.toFixed(2);if(!rafStarted){rafStarted=true;requestAnimationFrame(tick);}
}
for(const b of document.querySelectorAll('button'))b.disabled=true;
$('#weights').onchange=()=>{if(ready){R.skinning.useOriginalWeights(!$('#weights').value.includes('bodyfix'));render();}};
f.onload=()=>init().catch(e=>$('#measure').textContent=e.stack);
window.addEventListener('error',e=>$('#measure').textContent=e.message);
$('#before').onclick=()=>{I.RUN_TUNE.lean=I.RUN_TUNE.lean<.6?.65:.49;$('#lean').value=I.RUN_TUNE.lean;$('#leanValue').value=I.RUN_TUNE.lean.toFixed(3);advance(4);render();};
$('#play').onclick=()=>{playing=!playing;};$('#step').onclick=()=>{playing=false;advance(16);render();};
$('#lean').oninput=e=>{I.RUN_TUNE.lean=+e.target.value;$('#leanValue').value=e.target.value;advance(0);render();};
$('#match').onclick=async()=>{if(!ready||busy)return;busy=true;playing=false;let lo=.05,hi=1.2;
 for(let i=0;i<13;i++){I.RUN_TUNE.lean=(lo+hi)/2;for(let k=0;k<30;k++)advance(16);render();if(metrics.torsoAngle<desired)lo=I.RUN_TUNE.lean;else hi=I.RUN_TUNE.lean;}
 $('#lean').value=I.RUN_TUNE.lean;$('#leanValue').value=I.RUN_TUNE.lean.toFixed(3);
 I.RUN_TUNE.headCounter=1.05;
 let best={score:Infinity};
 for(let i=0;i<100;i++){advance(8);render();const l=[point('LeftLeg'),point('LeftFoot')],r=[point('RightLeg'),point('RightFoot')];const dist=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1])**2;const score=(a,b)=>dist(a[0],REF.leadKnee)+dist(a[1],REF.leadAnkle)+dist(b[0],REF.trailKnee)+dist(b[1],REF.trailAnkle);let err=Math.min(score(l,r),score(r,l));if(err<best.score)best={score:err,phase:R.loco.u};}
 R.loco.u=best.phase;advance(4);render();busy=false;
};
$('#compare').onclick=async()=>{
 playing=false;const old={view:$('#view').value,bones:$('#bones').checked,volume:$('#volume').checked,weights:$('#weights').value};
 const out=document.createElement('canvas');out.width=3072;out.height=768;const ctx=out.getContext('2d');
 $('#view').value='model';$('#bones').checked=false;
 for(let i=0;i<2;i++){
  $('#weights').value=i?'/assets/ninja-bodyfix-v1.glb':'/assets/raw/backup-before-run-body-fix-2026-10-20/ninja.glb';$('#volume').checked=!!i;render();ctx.fillStyle='#aaa';ctx.fillRect(i*1024,0,1024,768);ctx.save();ctx.translate(i*1024+154,80);ctx.scale(.7,.7);ctx.translate(transform.x,transform.y);ctx.scale(transform.scale,transform.scale);ctx.drawImage(I.renderer.domElement,0,0,1024,768);ctx.restore();
  ctx.fillStyle='#15191f';ctx.fillRect(i*1024,0,1024,58);ctx.fillStyle='#fff';ctx.font='26px system-ui';ctx.fillText(i?'AFTER: corrected weights + volume skinning':'BEFORE: original weights + linear skinning',i*1024+18,38);
 }
 ctx.fillStyle='#aaa';ctx.fillRect(2048,0,1024,768);ctx.drawImage(ref,2202,80,716.8,535.5);ctx.fillStyle='#15191f';ctx.fillRect(2048,0,1024,58);ctx.fillStyle='#fff';ctx.fillText('REFERENCE',2066,38);
 $('#view').value=old.view;$('#bones').checked=old.bones;$('#volume').checked=old.volume;$('#weights').value=old.weights;render();
 await new Promise(resolve=>out.toBlob(async blob=>{await fetch('/debug/save?name=run-body-before-after-ref.png',{method:'POST',body:blob});resolve();}));
 $('#measure').textContent+=' · Saved same-frame before / after / ref';
};
$('#save').onclick=async()=>{playing=false;render();await new Promise(resolve=>cv.toBlob(async blob=>{await fetch('/debug/save?name=run-overlay-'+($('#weights').value.includes('bodyfix')?'fixed':'original')+'.png',{method:'POST',body:blob});resolve();}));await fetch('/debug/save?name=run-overlay-'+($('#weights').value.includes('bodyfix')?'fixed':'original')+'.json',{method:'POST',body:JSON.stringify(metrics,null,2)});$('#measure').textContent+=' · Saved overlay PNG + JSON';};
</script></html>
